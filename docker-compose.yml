# docker-scout-scanner
#   Dashboard: https://<this-host>:8443   (TLS + sign-in, fine for your LAN)
#   Admin:     https://127.0.0.1:8444     (published on localhost only)
# Settings live in .env (copy .env.example).

name: docker-scanner

services:
  # Read-only, GET-only view of the Docker API, served by the scanner binary
  # itself (`scanner socket-proxy`). Only image/container listing, image
  # inspect/history/export, events and version pass; everything else gets 403.
  # The scanner never gets the raw socket, so a compromised scanner cannot
  # start containers, read container files or touch the host.
  socket-proxy:
    image: ghcr.io/cfunkz/docker-scout-scanner:${VERSION:-latest}
    command: ["socket-proxy"]
    restart: unless-stopped
    # root only to open the socket; no capabilities, read-only filesystem.
    user: "0:0"
    environment:
      HEALTH_PING: "1"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m

  scanner:
    build:
      context: ./backend
      args:
        GO_IMAGE: ${GO_IMAGE:-golang:1.27-alpine}
        TRIVY_VERSION: ${TRIVY_VERSION:-v0.76.1}
        GRYPE_VERSION: ${GRYPE_VERSION:-v0.121.0}
        WITH_GRYPE: ${WITH_GRYPE:-true}
    image: ghcr.io/cfunkz/docker-scout-scanner:${VERSION:-latest}
    restart: unless-stopped
    depends_on: [socket-proxy]
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      TLS_SANS: ${TLS_SANS:-}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DEFAULT_ENGINE: ${DEFAULT_ENGINE:-trivy}
      OFFLINE: ${OFFLINE:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-UTC}
    volumes:
      - scanner-data:/data
      - certs:/certs
    networks: [docker, app, egress]
    read_only: true
    tmpfs: [/tmp:size=64m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${SCANNER_MEM_LIMIT:-1g}

  web:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:alpine}
    image: ghcr.io/cfunkz/docker-scout-scanner-web:${VERSION:-latest}
    restart: unless-stopped
    depends_on:
      scanner:
        condition: service_healthy
    environment:
      SCANNER_UPSTREAM: scanner
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      HTTP_MODE: ${HTTP_MODE:-redirect}
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      PUBLIC_HTTPS_PORT: ${DASHBOARD_PORT:-8443}
      ADMIN_ALLOW: ${ADMIN_ALLOW:-}
    ports:
      - "${DASHBOARD_BIND:-0.0.0.0}:${DASHBOARD_PORT:-8443}:8443"
      - "${DASHBOARD_BIND:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
      # The admin panel is only ever published on loopback.
      - "127.0.0.1:${ADMIN_PORT:-8444}:8444"
    volumes:
      - certs:/certs:ro
    networks: [app, edge]
    cap_drop: [ALL]
    # DAC_OVERRIDE lets the nginx master (root) read the key that the
    # non-root scanner generated; everything else stays dropped.
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m

volumes:
  scanner-data:
  certs:

networks:
  docker:
    internal: true
  app:
    internal: true
  egress: {}
  edge: {}
