# nginx front for docker-scout-scanner.
#   :8443  dashboard over TLS (safe to expose on your LAN or behind a reverse proxy)
#   :8080  plain HTTP: redirects to :8443, or (HTTP_MODE=proxy) serves the
#          dashboard to TRUSTED_PROXIES only, for TLS-terminating proxies
#   :8444  admin panel over TLS; compose publishes it on 127.0.0.1 only
# Snippets under /etc/nginx/generated/ are written at start-up by
# /docker-entrypoint.d/40-scanner.sh from environment variables.

user nginx;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types { application/javascript mjs; }

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 60s;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_user_agent" $request_time';
    access_log /dev/stdout main;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/csv image/svg+xml text/plain application/sarif+json application/vnd.cyclonedx+json;

    # Real client IP when running behind trusted reverse proxies.
    include /etc/nginx/generated/realip.conf;

    # Brute-force and abuse limits (the backend has its own per-user lockout too).
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # TLS: Mozilla "intermediate" profile.
    ssl_certificate     /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_hide_header X-Powered-By;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_buffering on;

    upstream dashboard_api { server ${SCANNER_UPSTREAM}:8000; keepalive 8; }
    upstream admin_api     { server ${SCANNER_UPSTREAM}:8001; keepalive 4; }

    # Reject requests for unknown Host headers on plain HTTP (DNS rebinding hygiene).
    include /etc/nginx/generated/http.conf;

    # ---------------- dashboard (LAN / reverse proxy) ----------------
    server {
        listen 8443 ssl;
        http2 on;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        limit_conn conn 50;

        include /etc/nginx/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # The admin UI is not served on this port.
        location = /admin.html       { return 404; }
        location = /assets/admin.js  { return 404; }
        location ^~ /api/admin/      { return 404; }
        location = /metrics          { return 404; }

        location = /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://dashboard_api;
        }
        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://dashboard_api;
        }
        location /assets/ {
            include /etc/nginx/security-headers.conf;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }
        location / {
            try_files $uri /index.html;
        }
    }

    # ---------------- admin (localhost only) ----------------
    server {
        listen 8444 ssl;
        http2 on;
        server_name _;
        root /usr/share/nginx/html;
        index admin.html;
        limit_conn conn 20;

        include /etc/nginx/security-headers.conf;
        include /etc/nginx/generated/admin-allow.conf;

        location = /index.html { return 404; }
        location = /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://admin_api;
        }
        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://admin_api;
        }
        location = /metrics { proxy_pass http://admin_api; }
        location /assets/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }
        location / {
            try_files $uri /admin.html;
        }
    }
}
